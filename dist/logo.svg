<svg viewBox="0 0 340 72" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Mark: E icon with building bars + compass needle -->
  <rect x="2" y="2" width="68" height="68" rx="10" fill="#0A1628"/>
  <!-- Vertical spine -->
  <rect x="17" y="17" width="5" height="38" rx="2" fill="white"/>
  <!-- Top bar -->
  <rect x="17" y="17" width="34" height="8" rx="2" fill="#F05A28"/>
  <!-- Middle bar -->
  <rect x="17" y="32" width="26" height="8" rx="2" fill="white"/>
  <!-- Bottom bar -->
  <rect x="17" y="47" width="34" height="8" rx="2" fill="#F05A28"/>
  <!-- East pointer triangle -->
  <polygon points="54,36 46,30 46,42" fill="#F05A28"/>

  <!-- Vertical divider -->
  <rect x="84" y="10" width="2" height="52" rx="1" fill="#CBD5E1"/>

  <!-- EAST -->
  <text x="96" y="35" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="23" letter-spacing="3" fill="#0A1628">EAST</text>
  <!-- PROJECTS -->
  <text x="96" y="62" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="21" letter-spacing="1.5" fill="#F05A28">PROJECTS</text>
</svg>
